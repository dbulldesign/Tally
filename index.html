  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content\">\n<title>Tally<\u002Ftitle>\n<link rel=\"manifest\" href=\"manifest.webmanifest\">\n<link rel=\"icon\" type=\"image/svg+xml\" href=\"icon.svg\">\n<meta name=\"theme-color\" content=\"#2d4257\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-title\" content=\"Tally\">\n<script src=\"6e746952-477e-410e-bb16-256092bf567b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  *{box-sizing:border-box}\n  html,body{margin:0}\n  body{font-family:-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Segoe UI\",system-ui,sans-serif;background:#dcdde1;-webkit-font-smoothing:antialiased;}\n  a{color:var(--accent);text-decoration:none}\n  .tapp{\n    --desk:#dcdde1;--bg:#fff;--bg2:#f4f4f6;--bg3:#f7f7f9;--text:#1d1d1f;--text2:#56565e;--text3:#6e6e78;\n    --sep:#ededf0;--sep2:#e3e3e7;--accent:#007aff;--accentfill:#0064d2;--amber:#9c5a0d;--chip:#f0f0f3;--chipink:#5a5a60;\n    --err:#c8332a;--warnink:#8a5300;--danger:#d32b1f;\n    --tag:#e5f0ff;--tagink:#0058c7;--total:#1d1d1f;--totalink:#fff;--totalsub:#9a9aa0;--field:#ececf0;--fieldbrd:#e0e0e5;\n    --tbar1:#fcfcfe;--tbar2:#eff0f3;--tbrd:#dcdce0;--seg:#e9e9ee;--card:#fff;--good:#34c759;--warn:#ff9f0a;\n    --rpy:11px;--shadow:0 32px 64px -20px rgba(0,0,0,.4),0 0 0 .5px rgba(0,0,0,.12);--hoverring:rgba(0,122,255,.22);\n  }\n  .tapp[data-theme=\"dark\"]{\n    --desk:#161617;--bg:#1e1e20;--bg2:#252528;--bg3:#232326;--text:#f5f5f7;--text2:#c2c2c8;--text3:#8a8a94;\n    --sep:#2c2c2f;--sep2:#333336;--accent:#0a84ff;--accentfill:#0a6fd8;--amber:#e6a444;--chip:#2e2e33;--chipink:#c0c0c6;\n    --err:#ff8b80;--warnink:#ff9f0a;--danger:#e04a3c;\n    --tag:#0a3466;--tagink:#7fb4ff;--total:#0e0e10;--totalink:#f5f5f7;--totalsub:#7a7a80;--field:#2a2a2e;--fieldbrd:#3a3a3f;\n    --tbar1:#37373a;--tbar2:#2c2c2f;--tbrd:#161618;--seg:#3a3a3f;--card:#252528;--good:#30d158;--warn:#ff9f0a;\n    --shadow:0 32px 64px -20px rgba(0,0,0,.7),0 0 0 .5px rgba(0,0,0,.5);--hoverring:rgba(10,132,255,.32);\n  }\n  .tapp[data-density=\"compact\"]{--rpy:5px;}\n  .tapp [style*=\"cursor: pointer\"],.tapp [style*=\"cursor:pointer\"]{outline:1px solid transparent;outline-offset:1px;transition:outline-color .12s ease,background .12s ease;}\n  .tapp [style*=\"cursor: pointer\"]:hover,.tapp [style*=\"cursor:pointer\"]:hover{outline-color:var(--hoverring);}\n  .tinput{font:inherit;border:0;background:transparent;outline:none;color:var(--text);}\n  .mono{font-family:ui-monospace,\"SF Mono\",SFMono-Regular,Menlo,monospace}\n  .tapp ::-webkit-scrollbar{width:10px;height:10px}\n  .tapp ::-webkit-scrollbar-thumb{background:rgba(130,130,140,.4);border-radius:6px;border:2px solid transparent;background-clip:content-box}\n  /* Worksheet rows reveal their delete affordance on hover; touch devices have no\n     hover, so keep it faintly visible there. */\n  .tapp .prow .pdel{opacity:0;transition:opacity .12s ease;}\n  .tapp .prow:hover .pdel{opacity:.6;}\n  .tapp .prow .pdel:hover{opacity:1;outline-color:transparent !important;}\n  @media (hover:none){.tapp .prow .pdel{opacity:.55;}}\n  @keyframes tpop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}\n\n  /* ============ ONE LAYOUT, THREE WIDTHS ============\n     Inline styles cannot carry media queries, so the shell, rows, and editable\n     fields own real classes and the logic keeps only pane state. The worksheet\n     is permanent at every width; the worksheet list and inspector dock when\n     there is room and are summoned as sheets when there is not.\n       >=1100px  three panes, as before\n       760-1099  worksheet + inspector, list shrinks to a rail of colour dots\n       <760px    single pane, both panels become bottom sheets            */\n  .tshell{height:100vh;height:100dvh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);}\n  .tbody{display:grid;grid-template-columns:1fr;flex:1;min-height:0;}\n  .tsidebar{padding:12px 10px;border-right:.5px solid var(--sep2);}\n  .tinspector{border-left:.5px solid var(--sep2);}\n  .tinspector-body{overflow:auto;padding:0 14px 16px;display:flex;flex-direction:column;gap:8px;}\n  .trail,.tsheet-head,.tmobile,.tkeys{display:none;}\n  .ttitlebar{display:flex;align-items:center;}\n  .tfmtgroup,.tselgroup{display:flex;gap:2px;background:var(--seg);border-radius:8px;padding:2px;}\n  .tscrim{display:none;position:fixed;inset:0;background:rgba(12,16,22,.45);z-index:55;}\n\n  /* worksheet furniture \u2014 sizes and paddings that change with width */\n  .twshead{padding:16px 22px 10px;display:flex;align-items:center;gap:12px;}\n  .thead-cols{display:grid;grid-template-columns:16px 32px 1fr 178px;gap:6px;padding:6px 22px;}\n  .tlist{overflow:auto;flex:1;}\n  .trow{display:grid;grid-template-columns:16px 32px 1fr 178px;gap:6px;padding:var(--rpy) 22px;align-items:center;border-bottom:.5px solid var(--sep);}\n  .tnewrow{display:grid;grid-template-columns:16px 32px 1fr 178px;gap:6px;padding:var(--rpy) 22px;align-items:center;}\n  /* A section header keeps its own subtotal in view while its lines scroll. */\n  .tsep{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:8px 22px 7px;background:var(--bg2);border-top:.5px solid var(--sep2);border-bottom:.5px solid var(--sep2);}\n  .ttotal{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--total);color:var(--totalink);border-top:.5px solid var(--sep2);}\n  .tsearchwrap{width:196px;}\n\n  /* Editable text carries its size in CSS so small screens can raise it to the\n     16px floor that stops iOS zooming the whole app on focus. */\n  .texpr{font-size:14px;} .tqty{font-size:13.5px;} .tseclabel{font-size:11px;}\n  .tsearch{font-size:12.5px;} .tfield{font-size:11.5px;} .tqc{font-size:15px;} .tstock{font-size:13px;}\n  .tinput::placeholder{color:var(--text2);opacity:1;}\n  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}\n  .tapp [role=\"button\"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}\n  .tinput:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px;}\n  /* measurements belong in a column, so the digits have to share a width */\n  .mono{font-variant-numeric:tabular-nums;font-feature-settings:\"tnum\" 1;}\n  /* Small marks stay small; only their hit area grows. */\n  .thit{display:grid;place-items:center;cursor:pointer;}\n  .tbtn{display:grid;place-items:center;width:31px;height:31px;flex:none;}\n  .tsecbtn{display:inline-grid;place-items:center;padding:6px 11px;}\n  /* A name long enough to run over the result column now stops at the column. */\n  .tchip{max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}\n  @media (max-width:759.98px){ .tcell-expr [role=\"button\"].tchip{min-height:28px;display:inline-flex;align-items:center;padding:2px 10px;} }\n  .tsum{font-size:12px;}\n\n  @media (min-width:1100px){\n    .tapp[data-sidebar=\"1\"][data-inspector=\"1\"] .tbody{grid-template-columns:224px 1fr 300px;}\n    .tapp[data-sidebar=\"1\"][data-inspector=\"0\"] .tbody{grid-template-columns:224px 1fr;}\n    .tapp[data-sidebar=\"0\"][data-inspector=\"1\"] .tbody{grid-template-columns:1fr 300px;}\n  }\n  @media (min-width:760px) and (max-width:1099.98px){\n    .tapp[data-sidebar=\"1\"][data-inspector=\"1\"] .tbody{grid-template-columns:auto 1fr 280px;}\n    .tapp[data-sidebar=\"1\"][data-inspector=\"0\"] .tbody{grid-template-columns:auto 1fr;}\n    .tapp[data-sidebar=\"0\"][data-inspector=\"1\"] .tbody{grid-template-columns:1fr 280px;}\n    .tapp[data-sidebar=\"1\"] .trail{display:flex;}\n    .trail{flex-direction:column;align-items:center;gap:9px;width:46px;padding:11px 0 calc(11px + env(safe-area-inset-bottom));background:var(--bg2);border-right:.5px solid var(--sep2);overflow:auto;}\n    .trail-btn{min-width:34px;min-height:34px;display:grid;place-items:center;border-radius:9px;color:var(--text2);font-size:16px;cursor:pointer;flex:none;}\n  }\n\n  /* --- panels as bottom sheets --- */\n  .tsidebar,.tinspector{transition:transform .34s cubic-bezier(.16,1,.3,1),visibility .34s;}\n  @media (max-width:1099.98px){\n    .tsidebar{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:56;height:auto;max-height:min(86dvh,660px);\n      border-right:0;border-top:.5px solid var(--sep2);border-radius:17px 17px 0 0;\n      box-shadow:0 -14px 44px -10px rgba(0,0,0,.42);\n      padding:0 10px calc(12px + env(safe-area-inset-bottom));\n      transform:translateY(101%);visibility:hidden;}\n    .tapp[data-sheet=\"sidebar\"] .tsidebar{transform:none;visibility:visible;}\n    .tapp[data-sheet=\"sidebar\"] .tscrim{display:block;}\n    .tsidebar .tsheet-head{display:flex;}\n  }\n  @media (max-width:759.98px){\n    .tinspector{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:56;height:auto;max-height:min(86dvh,660px);\n      border-left:0;border-top:.5px solid var(--sep2);border-radius:17px 17px 0 0;\n      box-shadow:0 -14px 44px -10px rgba(0,0,0,.42);\n      transform:translateY(101%);visibility:hidden;}\n    .tapp[data-sheet=\"inspector\"] .tinspector{transform:none;visibility:visible;}\n    .tapp[data-sheet=\"inspector\"] .tscrim{display:block;}\n    .tinspector .tsheet-head{display:flex;}\n    .tinspector-body{padding-bottom:calc(16px + env(safe-area-inset-bottom));}\n  }\n  .tsheet-head{position:sticky;top:0;z-index:3;background:inherit;align-items:center;gap:10px;\n    padding:14px 4px 8px;border-bottom:.5px solid var(--sep);flex:none;touch-action:none;cursor:grab;}\n  .tgrab{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:38px;height:4px;border-radius:2px;background:var(--sep2);}\n  .tsheet-title{flex:1;font-size:13px;font-weight:650;color:var(--text);}\n  .tsheet-x{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--text3);font-size:17px;cursor:pointer;}\n\n  /* --- phone --- */\n  @media (max-width:759.98px){\n    .ttitlebar,.tfmtgroup,.tselgroup,.thead-cols{display:none;}\n    .tfmtchip{display:inline-flex !important;}\n    .tsearchwrap{width:auto;flex:1;min-width:0;}\n    .twshead{padding:11px 13px 7px;}\n    .tsep{padding:9px 13px 8px;}\n    .ttotal{padding:11px 13px;}\n    .tapp[data-density=\"compact\"]{--rpy:8px;}\n    /* Result drops under the expression instead of fighting it for width. */\n    .trow{grid-template-columns:34px 56px 1fr;grid-template-areas:\"pin qty expr\" \"pin qty res\";\n      padding:var(--rpy) 13px;row-gap:3px;}\n    .tcell-pin{grid-area:pin;} .tcell-qty{grid-area:qty;} .tcell-expr{grid-area:expr;} .tcell-res{grid-area:res;}\n    .tnewrow{grid-template-columns:34px 1fr;padding:var(--rpy) 13px;}\n    .tnewrow>span:nth-child(2),.tnewrow>span:nth-child(4){display:none;}\n    .texpr,.tqty,.tseclabel,.tsearch,.tfield,.tqc,.tstock{font-size:16px;}\n    .tqty::placeholder{font-size:11px;letter-spacing:.04em;}\n    .tseclabel{letter-spacing:.04em;}\n    .tfield{min-height:38px;}\n    /* every mark you can tap gets a thumb-sized target, none of them grow */\n    .tcell-pin,.thit{min-width:44px;min-height:44px;}\n    .tsum{min-width:44px;min-height:44px;display:grid;place-items:center;font-size:15px;}\n    /* controls inside the sheets are reachable by thumb too */\n    .tsidebar [role=\"button\"],.tinspector [role=\"button\"]{min-height:44px;}\n    .ttabs>span,.tsfoot>span{display:flex;align-items:center;justify-content:center;}\n    .tsidebar .prow,.tnewrow{min-height:44px;}\n    .tsidebar [role=\"button\"][style*=\"border-radius:7px\"]{padding-left:11px;padding-right:11px;}\n    .tbtn{width:44px;height:44px;}\n    .tsecbtn{min-height:44px;padding:6px 14px;}\n    .tsearchwrap{min-height:44px;}\n    /* the three alternate unit conversions are what the Auto chip is for */\n    .tsubunits{display:none;}\n    .pdel{min-width:44px;min-height:44px;display:grid;place-items:center;}\n    .tmobile{display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));\n      background:var(--bg3);border-top:.5px solid var(--sep2);flex:none;}\n    .tmobile>span{min-height:44px;flex:1;display:flex;align-items:center;justify-content:center;gap:7px;\n      border-radius:10px;font-size:13px;font-weight:550;cursor:pointer;\n      border:.5px solid var(--fieldbrd);color:var(--text2);}\n    .tmobile>span.tprimary{flex:1.3;background:var(--accentfill);color:#fff;border-color:transparent;}\n    /* The syntax row: the glyphs this app is made of, two keyboard layers deep\n       otherwise. --kb lifts it above the software keyboard on iOS. */\n    .tapp[data-keys=\"1\"] .tkeys{display:flex;}\n    .tapp[data-keys=\"1\"] .tmobile{display:none;}\n    .tkeys{gap:6px;padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:var(--bg3);\n      border-top:.5px solid var(--sep2);flex:none;\n      transform:translateY(calc(-1 * var(--kb,0px)));}\n    .tkeys>span{flex:1;min-height:44px;display:grid;place-items:center;border-radius:9px;\n      background:var(--field);border:.5px solid var(--fieldbrd);color:var(--text);\n      font-size:17px;font-weight:550;cursor:pointer;user-select:none;}\n  }\n  .tprint-head{display:none;}\n  /* Print used to emit one page of on-screen rows wrapped in app chrome. */\n  @media print{\n    .ttitlebar,.ttoolbar,.tsidebar,.tinspector,.trail,.tmobile,.tkeys,.tscrim,.tfmtchip{display:none !important;}\n    .tapp{--bg:#fff;--bg2:#fff;--bg3:#fff;--card:#fff;--text:#000;--text2:#333;--text3:#555;\n      --sep:#ccc;--sep2:#bbb;--total:#fff;--totalink:#000;--totalsub:#333;--amber:#000;--chip:#eee;--chipink:#333;\n      --tag:#eee;--tagink:#333;height:auto !important;}\n    .tshell{height:auto !important;overflow:visible !important;box-shadow:none !important;}\n    .tbody{display:block !important;}\n    .tlist{overflow:visible !important;flex:none !important;}\n    .trow,.tnewrow{padding-left:0 !important;padding-right:0 !important;break-inside:avoid;}\n    .tnewrow{display:none !important;}\n    .thead-cols{display:grid !important;padding-left:0 !important;padding-right:0 !important;}\n    .tsep{position:static !important;break-inside:avoid;break-after:avoid;padding-left:0 !important;padding-right:0 !important;background:#f2f2f2 !important;}\n    .twshead{display:none !important;}\n    .tprint-head{display:block !important;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #999;}\n    .ttotal{break-before:avoid;border-top:1.5px solid #000 !important;padding-left:0 !important;padding-right:0 !important;}\n    .tcell-res .mono{color:#000 !important;}\n    @page{margin:14mm;}\n  }\n  @media (prefers-reduced-motion:reduce){\n    .tsidebar,.tinspector{transition:none;}\n  }\n<\u002Fstyle>\n<script>/* THE release number for this build \u2014 the one line to bump. It drives the\n   offline cache key below, the titlebar badge, Settings > About, the window\n   title, and the appVersion field of exported worksheet files. */\nwindow.TALLY_VERSION='1.4.0';\ntry{ if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js?v='+window.TALLY_VERSION).catch(function(){}); }); } }catch(e){}\n<\u002Fscript>\n<script src=\"cadd5ff2-c137-48d1-85ab-a4e3af0356e8\"><\u002Fscript>\n<\u002Fhelmet>\n\n\n\n<div class=\"tapp\" data-theme=\"{{ theme }}\" data-density=\"{{ density }}\" data-sidebar=\"{{ hasSidebar }}\" data-inspector=\"{{ hasInspector }}\" data-sheet=\"{{ sheet }}\" data-keys=\"{{ keysOn }}\" style=\"background:var(--bg);color:var(--text);{{ accentVar }}\" sc-camel-on-click=\"{{ onBackdrop }}\" sc-camel-on-context-menu=\"{{ onAppCtx }}\">\n  <div class=\"tshell\" style=\"width:100%;background:var(--bg);overflow:hidden;box-shadow:none;position:relative;display:flex;flex-direction:column;\">\n\n    <!-- TITLEBAR -->\n    <div class=\"ttitlebar\" style=\"height:42px;padding:0 14px;background:linear-gradient(var(--tbar1),var(--tbar2));border-bottom:.5px solid var(--tbrd);position:relative;\">\n      <div style=\"position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:600;color:var(--text);pointer-events:none;\">Tally \u2014 {{ activeName }}<\u002Fdiv>\n      <span class=\"mono\" title=\"Tally version\" style=\"font-size:10.5px;font-weight:600;color:var(--text2);background:var(--seg);border-radius:5px;padding:2px 6px;z-index:2;\">v{{ version }}<\u002Fspan>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <div style=\"display:flex;gap:2px;background:var(--seg);border-radius:7px;padding:2px;z-index:2;\">\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ setLight }}\" style=\"{{ lightBtn }}\">Light<\u002Fspan>\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ setDark }}\" style=\"{{ darkBtn }}\">Dark<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- TOOLBAR -->\n    <div class=\"ttoolbar\" style=\"display:flex;align-items:center;gap:12px;padding:9px 14px;background:var(--bg3);border-bottom:.5px solid var(--sep2);position:relative;z-index:3;\">\n      <sc-if value=\"{{ f.formats }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"tfmtgroup\">\n        <sc-for list=\"{{ formats }}\" as=\"ff\" hint-placeholder-count=\"4\">\n          <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ ff.on }}\" style=\"{{ ff.style }}\">{{ ff.label }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span role=\"button\" tabindex=\"0\" class=\"tfmtchip\" sc-camel-on-click=\"{{ openFmt }}\" title=\"Unit format\" style=\"display:none;align-items:center;gap:5px;min-height:44px;padding:0 12px;border-radius:8px;background:var(--seg);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;\">{{ fmtLabel }} <span style=\"color:var(--text3);font-size:10px;\">\u25be<\u002Fspan><\u002Fspan>\n      <\u002Fsc-if>\n      <div class=\"tselgroup\">\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ selectAll }}\" title=\"Pin every line to the total\" style=\"font-size:12px;padding:5px 10px;border-radius:6px;color:var(--text2);cursor:pointer;\">Select all<\u002Fspan>\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ deselectAll }}\" title=\"Clear all pinned lines\" style=\"font-size:12px;padding:5px 10px;border-radius:6px;color:var(--text2);cursor:pointer;\">Deselect all<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <sc-if value=\"{{ filter }}\" hint-placeholder-val=\"x\">\n        <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ clearFilter }}\" aria-label=\"Clear the @{{ filter }} filter\" style=\"font-size:12px;color:var(--tagink);background:var(--tag);border-radius:14px;padding:5px 12px;cursor:pointer;\">@{{ filter }} \u2715<\u002Fspan>\n      <\u002Fsc-if>\n      <div class=\"tsearchwrap\" style=\"display:flex;align-items:center;gap:7px;background:var(--field);border:.5px solid var(--fieldbrd);border-radius:8px;padding:0 10px;\">\n        <svg aria-hidden=\"true\" width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--text3)\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m21 21-4.3-4.3\"><\u002Fpath><\u002Fsvg>\n        <input class=\"tinput mono tsearch\" value=\"{{ search }}\" sc-camel-on-input=\"{{ onSearch }}\" placeholder=\"Search or filter\u2026\" aria-label=\"Search or filter lines\" style=\"width:100%;padding:6px 0;color:var(--text);\">\n      <\u002Fdiv>\n      <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ addLine }}\" class=\"tbtn tbtn-add\" aria-label=\"Add line\" title=\"Add line\" style=\"border-radius:7px;background:var(--accentfill);color:#fff;font-size:19px;cursor:pointer;\">+<\u002Fspan>\n      <span role=\"button\" tabindex=\"0\" sc-camel-on-click=\"{{ toggleM nd(l=>l.id===id);return ln&&ln.pinned;});\n    this.setLines(ls=>ls.map(l=>ids.indexOf(l.id)>=0?{...l,pinned:!allPinned}:l)); }\n  setProjectColor(id,color){ this.setState(s=>({projects:s.projects.map(p=>p.id===id?{...p,color}:p), ctx:null})); }\n  setFix(i,patch){ this.setState(s=>({fixtures:s.fixtures.map((f,j)=>j===i?{...f,...patch}:f)})); }\n  setChan(i,patch){ this.setState(s=>({channels:s.channels.map((c,j)=>j===i?{...c,...patch}:c)})); }\n  setLink(kind,i,val){ this.setState(s=>{\n    const fixtures=s.fixtures.map(f=>({...f})); const channels=s.channels.map(c=>({...c}));\n    if(kind==='fixture'){ const f=fixtures[i]; const old=f.link; f.link=val;\n      channels.forEach(c=>{ if(c.code===old && c.link===f.code) c.link=''; });\n      if(val) channels.forEach(c=>{ if(c.code===val) c.link=f.code; });\n    } else { const c=channels[i]; const old=c.link; c.link=val;\n      fixtures.forEach(f=>{ if(f.code===old && f.link===c.code) f.link=''; });\n      if(val) fixtures.forEach(f=>{ if(f.code===val) f.link=c.code; });\n    }\n    return {fixtures,channels};\n  }); }\n  PAL(){ return ['#0a84ff','#34c759','#ff9f0a','#ffd60a','#af52de','#ff375f']; }\n  newProjectId(){ return 'p'+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36); }\n  addProject(){ const id=this.newProjectId(); const pal=this.PAL();\n    this.setState(s=>({projects:[...s.projects,{id,name:'Untitled',color:pal[s.projects.length%pal.length],lines:[{id:s.seq+1,qty:'',expr:'',pinned:false}]}],\n      active:id,seq:s.seq+1,filter:null,search:'',ctx:null,menuOpen:false}));\n    this.focusName(); }\n  dupProject(pid){ const src=this.state.projects.find(p=>p.id===(pid||this.state.active))||this.proj(); const id=this.newProjectId();\n    this.setState(s=>({projects:[...s.projects,{...src,id,name:src.name+' copy',lines:src.lines.map(l=>({...l}))}],\n      active:id,filter:null,search:'',ctx:null,menuOpen:false})); }\n  openProject(id){ this.setState({active:id,filter:null,search:'',ctx:null,menuOpen:false}); }\n  renameProject(id){ this.openProject(id); this.focusName(); }\n  focusName(){ setTimeout(()=>{ const el=document.querySelector('[data-tname]'); if(el){ el.focus(); if(el.select) el.select(); } },50); }\n  /* A worksheet with nothing but blank lines needs no confirmation to delete. */\n  emptyProject(p){ return !!p && p.lines.every(l=>!l.sep && !String(l.qty||'').trim() && !String(l.expr||'').trim()); }\n  askDeleteProject(id){\n    const p=this.state.projects.find(x=>x.id===id);\n    this.closeCtx();\n    if(!p) return;\n    const last=this.state.projects.length===1;\n    if(this.emptyProject(p)){ if(!last) this.deleteProject(id); else this.setState({menuOpen:false}); return; }\n    const n=p.lines.filter(l=>l.sep || String(l.qty||'').trim() || String(l.expr||'').trim()).length;\n    this.ask('Delete \\u201c'+(p.name||'Untitled')+'\\u201d?',\n      n+(n===1?' line':' lines')+' will be removed'+(last?', and a blank worksheet takes its place':'')+\n      '. This cannot be undone \\u2014 export the file first if you want a copy.',\n      'Delete', ()=>this.deleteProject(id));\n  }\n  deleteProject(id){\n    this.setState(s=>{\n      const i=s.projects.findIndex(p=>p.id===id);\n      if(i<0) return {};\n      const base={filter:null, search:'', ctx:null, menuOpen:false};\n      const rest=s.projects.filter(p=>p.id!==id);\n      if(!rest.length){\n        // Never leave the app with no worksheet at all \\u2014 start a blank one.\n        const fresh={id:this.newProjectId(), name:'Worksheet', color:(s.projects[i].color||'#0a84ff'),\n          lines:[{id:s.seq+1,qty:'',expr:'',pinned:false}]};\n        return {...base, projects:[fresh], active:fresh.id, seq:s.seq+1};\n      }\n      const active=(s.active===id) ? rest[Math.min(i,rest.length-1)].id : s.active;\n      return {...base, projects:rest, active};\n    });\n  }\n  askClearWorksheet(){\n    const p=this.proj();\n    if(this.emptyProject(p)){ this.setState({menuOpen:false,ctx:null}); return; }\n    this.ask('Clear \\u201c'+(p.name||'Untitled')+'\\u201d?',\n      'Every line in this worksheet is removed. The worksheet itself stays.', 'Clear',\n      ()=>this.setLines(()=>[{id:this.nextId(),qty:'',expr:'',pinned:false}]));\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
